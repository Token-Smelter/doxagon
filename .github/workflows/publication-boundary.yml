name: Publication boundary

on: [push, pull_request]

permissions:
  contents: read

jobs:
  reviewed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python scripts/build_platform_tree.py --check

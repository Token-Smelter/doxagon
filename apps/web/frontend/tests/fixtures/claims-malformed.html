<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Malformed claim, a synthetic telling</title><style>body{margin:0;background:#f6f1e6;color:#16130f;font:24px Georgia}section{height:100vh;display:grid;place-content:center}h1{font-size:3rem}</style></head><body><section><h1>The airlock</h1></section>
<script>
(() => {
    const documentId = 'synthetic-telling-malformed';
    const edition = '2026-telling';
    const cues = [{ id: 'airlock', title: 'The airlock', claims: ['not-a-doxa'] }];
    addEventListener('message', event => {
        if (event.source !== parent || parent === window || event.data?.type !== 'doxagon:connect' || !event.ports[0]) return;
        const port = event.ports[0];
        port.start();
        port.postMessage({ type: 'ready', documentId, edition, cues });
    });
})();
</script></body></html>

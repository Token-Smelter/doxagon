<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; frame-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Isolated document</title>
    <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;overflow:hidden}</style>
</head>
<body>
<script>
(() => {
    'use strict';
    let frame = null;
    let loaded = false;
    let bridge = null;
    let url = null;
    function connect() {
        if (!loaded || !bridge) return;
        frame.contentWindow.postMessage({ type: 'doxagon:connect' }, '*', [bridge]);
        bridge = null;
    }
    window.addEventListener('message', event => {
        if (window.parent === window || event.source !== window.parent) return;
        if (event.data?.type === 'doxagon:document' && !frame && event.data.bytes instanceof ArrayBuffer) {
            if (event.data.bytes.byteLength === 0 || event.data.bytes.byteLength > 32 * 1024 * 1024) return;
            // Create the blob here so its document inherits this restrictive CSP,
            // not the privileged application's policy. Its bytes stay unmodified.
            url = URL.createObjectURL(new Blob([event.data.bytes], { type: 'text/html' }));
            frame = document.createElement('iframe');
            frame.title = 'Authored document';
            frame.setAttribute('sandbox', 'allow-scripts');
            frame.setAttribute('allow', 'fullscreen');
            frame.addEventListener('load', () => { loaded = true; connect(); });
            frame.src = url;
            document.body.append(frame);
        } else if (event.data?.type === 'doxagon:connect' && event.ports.length === 1) {
            bridge?.close();
            bridge = event.ports[0];
            connect();
        }
    });
    window.addEventListener('pagehide', () => {
        bridge?.close();
        if (url) URL.revokeObjectURL(url);
    });
})();
</script>
</body>
</html>
